[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "banjo-decomp-harness"
version = "0.2.0"
description = "Resumable subscription-CLI matching harness with local C patterns for Banjo-Tooie"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
decomp-agent = "decomp_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
decomp_harness = ["*.toml", "*.md", "*.json"]
