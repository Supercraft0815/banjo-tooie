concurrency = 1
banjo_kazooie_repo = ""
worker_timeout = 600
build_timeout = 1800
technical_retries = 1
context_chars = 24000
max_attempts_per_function = 8
stagnation_window = 2
minimum_gain = 0.5
extra_attempts = 0
probe_cache_hours = 24

[build]
backend = "docker"
image = "banjo-tooie-decomp:local"
platform = "linux/amd64"
jobs = 4

[[routing]]
model = "gpt-6.1-sol"
effort = "medium"
attempts = 2
[[routing]]
model = "gpt-6.1-sol"
effort = "high"
attempts = 2
[[routing]]
model = "gpt-6-astra"
effort = "high"
attempts = 2
[[routing]]
model = "gpt-6-astra"
effort = "xhigh"
attempts = 2
